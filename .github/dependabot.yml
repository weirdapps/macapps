# The apps use no third-party packages, so the only pinned dependencies here
# are the GitHub Actions in .github/workflows. Every one is pinned by commit
# SHA, which nothing updates on its own without this file.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      # github/codeql-action/init and /analyze must stay on the same version,
      # or the run fails with "Loaded a configuration file for version X, but
      # running version Y". One group keeps them in one PR.
      codeql-action:
        patterns:
          - "github/codeql-action*"
